# Build the garlic seeder Rover firmware and publish a GitHub Release on version tags.
#
#   push to garlic-rover-4.7 / pull request / manual run -> build, upload workflow artifacts
#   push tag v*-garlic.* (e.g. v4.7.1-garlic.1)          -> build + create Release with all files
name: garlic-rover firmware

on:
  push:
    branches: [garlic-rover-4.7]
    tags: ['v*-garlic.*']
  pull_request:
    branches: [garlic-rover-4.7]
  workflow_dispatch:

concurrency:
  group: garlic-rover-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    # same toolchain image as upstream ArduPilot 4.7 CI (test_chibios.yml)
    container: ardupilot/ardupilot-dev-chibios:v0.1.3
    strategy:
      fail-fast: false
      matrix:
        board: [X-MAV-AP-H743v3]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Version name
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "name=dev-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Rover for ${{ matrix.board }}
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          export PATH="/opt/gcc-arm-none-eabi-10/bin:/github/home/.local/bin:$HOME/.local/bin:$PATH"
          ./waf configure --board "${{ matrix.board }}"
          ./waf rover

      - name: Check Lua bindings used by vcu_can.lua
        shell: bash
        run: |
          gen="build/${{ matrix.board }}/libraries/AP_Scripting/lua_generated_bindings.cpp"
          grep -q '"get_desired_speed"' "$gen"
          grep -q '"get_desired_turn_rate"' "$gen"
          echo "AR_AttitudeControl:get_desired_speed/get_desired_turn_rate present"

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          board="${{ matrix.board }}"
          ver="${{ steps.ver.outputs.name }}"
          bin="build/$board/bin"
          bl="Tools/bootloaders/${board}_bl.bin"
          stem="garlic-rover-${ver}-${board}"
          out="dist/$stem"
          mkdir -p "$out"
          python3 -m pip install --user --progress-bar off intelhex
          python3 Tools/scripts/make_intel_hex.py "$bin/ardurover.bin" "$bl" 128
          cp "$bin/ardurover.apj"          "$out/$stem.apj"
          cp "$bin/ardurover_with_bl.hex"  "$out/${stem}_with_bl.hex"
          cp "$bl"                         "$out/"
          cp garlic_rover/scripts/vcu_can.lua        "$out/"
          cp garlic_rover/params/garlic_rover.param  "$out/"
          cp garlic_rover/README.md garlic_rover/docs/*.md "$out/"
          (cd dist && python3 -c "import shutil,sys; shutil.make_archive(sys.argv[1], 'zip', '.', sys.argv[1])" "$stem")
          ls -la "$out" dist

      - uses: actions/upload-artifact@v4
        with:
          name: garlic-rover-${{ steps.ver.outputs.name }}-${{ matrix.board }}
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: garlic_rover

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          sed -e "s/@TAG@/${tag}/g" -e "s/@SHA@/${GITHUB_SHA::10}/g" \
              garlic_rover/release_notes.md > notes.md
          mapfile -t files < <(find artifacts -type f | sort -u)
          # the .md / .lua / .param files are identical for every board: upload each name once
          declare -A seen; upload=()
          for f in "${files[@]}"; do
            n="$(basename "$f")"
            [[ -n "${seen[$n]:-}" ]] && continue
            seen[$n]=1; upload+=("$f")
          done
          gh release create "$tag" "${upload[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "大蒜播种车 Rover 固件 ${tag}" \
            --notes-file notes.md
